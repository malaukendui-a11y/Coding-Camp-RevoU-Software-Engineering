<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table - Kenny</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-900 via-blue-900 to-indigo-800 flex items-center justify-center p-6">

    <div class="max-w-2xl w-full space-y-6">

        <!-- Page Title -->
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">📊 Tabel Nama</h1>
            <p class="text-blue-300 text-sm mt-1">Daftar kontak</p>
        </div>

        <!-- Table Card -->
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl overflow-hidden shadow-2xl">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-gradient-to-r from-violet-600/60 to-blue-600/60 text-white">
                        <th class="px-6 py-4 text-left font-bold tracking-wide">👤 Nama</th>
                        <th class="px-6 py-4 text-left font-bold tracking-wide">📞 No. Telp</th>
                        <th class="px-6 py-4 text-left font-bold tracking-wide">📍 Alamat</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-t border-white/10 hover:bg-white/10 transition text-white/90">
                        <td class="px-6 py-4 font-semibold">Kenny</td>
                        <td class="px-6 py-4 text-blue-200">087720052003</td>
                        <td class="px-6 py-4">
                            <span class="bg-violet-500/30 text-violet-200 px-3 py-1 rounded-full text-xs font-medium">Jakarta Timur</span>
                        </td>
                    </tr>
                    <tr class="border-t border-white/10 hover:bg-white/10 transition text-white/90">
                        <td class="px-6 py-4 font-semibold">Tasya</td>
                        <td class="px-6 py-4 text-blue-200">08394328393</td>
                        <td class="px-6 py-4">
                            <span class="bg-blue-500/30 text-blue-200 px-3 py-1 rounded-full text-xs font-medium">Jakarta Barat</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Back nav -->
        <div class="text-center">
            <a href="index.html" class="inline-block px-6 py-2 bg-white/20 hover:bg-white/30 transition rounded-full text-white text-sm font-semibold backdrop-blur-sm">
                ← Kembali ke Home
            </a>
        </div>

    </div>

</body>
</html>
