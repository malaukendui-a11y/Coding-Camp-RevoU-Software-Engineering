<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - Kenny</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-indigo-900 flex items-center justify-center p-6">

    <div class="max-w-lg w-full space-y-6">

        <!-- Page Title -->
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">📝 Contact Form</h1>
            <p class="text-purple-300 text-sm mt-1">Isi formulir di bawah ini</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-8 shadow-2xl">
            <form method="post" class="space-y-5">

                <!-- Nama -->
                <div class="space-y-1">
                    <label class="block text-white/80 text-sm font-semibold">Nama</label>
                    <input
                        type="text"
                        placeholder="Masukkan nama kamu"
                        class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-purple-400 transition"
                    />
                </div>

                <!-- Password -->
                <div class="space-y-1">
                    <label class="block text-white/80 text-sm font-semibold">Password</label>
                    <input
                        type="password"
                        placeholder="••••••••"
                        class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-purple-400 transition"
                    />
                </div>

                <!-- Checkbox -->
                <div class="flex items-center gap-3">
                    <input
                        type="checkbox"
                        id="agree"
                        class="w-5 h-5 rounded accent-purple-500 cursor-pointer"
                    />
                    <label for="agree" class="text-white/80 text-sm cursor-pointer">
                        Saya setuju dengan syarat dan ketentuan
                    </label>
                </div>

                <!-- Textarea -->
                <div class="space-y-1">
                    <label class="block text-white/80 text-sm font-semibold">Pesan</label>
                    <textarea
                        rows="4"
                        placeholder="Tulis Pesan Disini"
                        class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-purple-400 transition resize-none"
                    ></textarea>
                </div>

                <!-- Select -->
                <fieldset class="border border-white/20 rounded-2xl p-5 space-y-3">
                    <legend class="text-white font-semibold text-sm px-2">Pilih aja</legend>
                    <label class="block text-white/70 text-sm">Hayo apa</label>
                    <select class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-400 transition">
                        <optgroup label="Nama Awal" class="bg-slate-800">
                            <option class="bg-slate-800">Ananda</option>
                            <option class="bg-slate-800">Tasya</option>
                        </optgroup>
                        <optgroup label="Nama Akhir" class="bg-slate-800">
                            <option class="bg-slate-800">Kenny</option>
                            <option class="bg-slate-800">Amelia</option>
                        </optgroup>
                    </select>
                </fieldset>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-400 hover:to-indigo-400 active:scale-95 transition-all text-white font-bold py-3 rounded-xl shadow-lg shadow-purple-500/30 text-sm tracking-wide"
                >
                    🚀 Submit
                </button>

            </form>
        </div>

        <!-- Back nav -->
        <div class="text-center">
            <a href="index.html" class="inline-block px-6 py-2 bg-white/20 hover:bg-white/30 transition rounded-full text-white text-sm font-semibold backdrop-blur-sm">
                ← Kembali ke Home
            </a>
        </div>

    </div>

</body>
</html>
