<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Elemen Form Radio Button</title>
</head>
<body>
    <p>Jenis Kelamin : 
        <input type="radio" name="Jenis_Kelamin" value="Laki-laki"> Laki-laki
        <input type="radio" name="Jenis_Kelamin" value="Perempuan"> Perempuan
    </p>
    <br>
    <p>Golongan Darah :
        <input type="radio" name="Golongan_Darah" Value="A"> A
        <input type="radio" name="Golongan_Darah" Value="B"> B
        <input type="radio" name="Golongan_Darah" Value="AB"> AB
        <input type="radio" name="Golongan_Darah" Value="O"> O
    </p>
    <br/>
    <p>Agama :
        <input type="radio" name="Agama" Value="Kristen"> Kristen
        <input type="radio" name="Agama" Value="Islam"> Islam
        <input type="radio" name="Agama" Value="Hindu"> Hindu
        <input type="radio" name="Agama" Value="Budha"> Budha
    </p>
</body>
</html>
