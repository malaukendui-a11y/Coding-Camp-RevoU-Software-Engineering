<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Tag Select & Option</title>
</head>
<body>
    <p>Jenis Kopi :
    <select name="" id="">
        <option value="Americano">Americano</option>
        <option value="Caramel_Matchiatio" selected>Caramel Matchiatio</option>
        <option value="Cappucino">Cappucino</option>
        <option value="Cafe_Latte">Cafe Latte</option>
    </select>
    </p>
</body>
</html>
