<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Tag Fieldset & Legend</title>
</head>
<body>
    <fieldset>
        <legend>Data Peserta</legend>
        <p>Nama : <input type="text"></p>
        <p>Alamat : <input type="text"></p>
        <p>Nomor Telp : <input type="text"></p>
    </fieldset>
    <br/>
    <fieldset>
        <legend>Pilih Langganan</legend>
        <p><input type="checkbox">Netflix</p>
        <p><input type="checkbox">Spotify</p>
        <p><input type="checkbox">Youtube</p>
        <p><input type="checkbox">HBO</p>
    </fieldset>
</body>
</html>
