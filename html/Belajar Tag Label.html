<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Tag Label</title>
</head>
<body>
    <p>
        <label for="Username">Username : </label>
        <input type="text" name="Username" id="Username">
    </p>
    <p> Pilihan Hobby :
        <label for="Membaca">
        <input type="checkbox" name="Membaca" id="Membaca"> Membaca
        </label>
        <label for="Menulis">
        <input type="checkbox" name="Menulis" id="Menulis"> Menulis
        </label>
    </p>
    <p> Jenis Kelamin :
        <label for="Laki-laki">
            <input type="radio" name="Jenis Kelamin" id="Laki-laki">Laki-laki
        </label>
        <label for="Perempuan">
            <input type="radio" name="Jenis Kelamin" id="Perempuan">Perempuan
        </label>
        <br>
        <label for="Lainnya"> Lainnya :
            <input type="text" name="Jenis Kelamin" id="Lainnya">
        </label>
    </p>
</body>
</html>
