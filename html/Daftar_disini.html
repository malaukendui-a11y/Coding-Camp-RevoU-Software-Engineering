<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendafaran</title>
</head>
<body>
    <form action="">
        <fieldset>
            <p>Form Pendaftaran Akun</p>
            <p>Username : <input type="text" name="username" placeholder="Nama_Username" required></p>
            <p>E-mail : <input type="email" name="email" placeholder="email_anda" required></p>
            <p>No.Telp : <input type="tel" name="nomor_telepon" placeholder="No.telp_anda" required></p>

            <p>Password Confirmation 2 : <input type="password" name="password" required></p>
            <button type="submit">Daftar</button>
        </fieldset>
    </form>
</body>
