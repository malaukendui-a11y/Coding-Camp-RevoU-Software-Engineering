<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Atribut Rowspan & Colspan</title>
</head>
<body>
    <table border="1" cellspacing="1" cellpadding="10" align="center">
        <caption>Ini adalah table</caption>
        <tr>
            <th>Nama</th>
            <th>Alamat</th>
            <th>Umur</th>
        </tr>
        <tr>
            <td colspan="3">Ananda Kenny, Jakarta Timur, 23</td>
        </tr>
        <tr>
            <td rowspan="2">Ananda Kenny</td>
            <td colspan="2">Cipayung</td>
            <td>23</td>
        </tr>
        <tr>
            <!-- <td>Esqiel Bisaratua</td> -->
            <!-- <td>Taman Mini</td> -->
            <td>23</td>
        </tr>
    </table>
</body>
</html>
