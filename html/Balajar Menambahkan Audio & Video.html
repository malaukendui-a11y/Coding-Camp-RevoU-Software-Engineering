<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Menambahkan Audio</title>
</head>
<body>
    <h2>Belajar Menambahkan Audio</h2>
    <br/>
    <p>Audio adalah salah satu elemen multimedia yang dapat digunakan untuk menambahkan suara atau
    <audio  src="./multimedia/Musik.mp3" controls autoplay loop></audio>
    <br/>
    <p>Video adalah salah satu elemen multimedia yang dapat digunakan untuk menambahkan video atau
    <video src="./multimedia/55.mp4" width="180px"></video>
</body>
</html>
