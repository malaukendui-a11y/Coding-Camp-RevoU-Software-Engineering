<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Tag ul dan ol</title>
</head>
<body>
    <!-- 1. Ordered List -->
     <ol type="I">
        <li>Makanan</li>
        <li>Minuman</li>
        <li>Buah-buahan</li>
        <li>Sayuran</li>
     </ol>

    <!-- 2. Unordered List -->
     <ul type="square">
        <li>Mathca</li>
        <li>Teh</li>
        <li>Jus</li>
        <li>Air Mineral</li>
     </ul>

     <!-- 3. Description List -->
      <dl>
        <dt>HTML</dt>
        <dd>Hypertext Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
        <dt>JS</dt>
        <dd>JavaScript</dd>
      </dl>
</body>
</html>
