<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List - Kenny</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-900 via-teal-900 to-cyan-800 flex items-center justify-center p-6">

    <div class="max-w-md w-full space-y-6">

        <!-- Page Title -->
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">📋 Daftar Minat</h1>
            <p class="text-teal-300 text-sm mt-1">Kenny's interest list</p>
        </div>

        <!-- Unordered List Card -->
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-8 shadow-2xl">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-2">
                <span class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-sm">✦</span>
                Minat Bidang
            </h2>
            <ul class="space-y-3">
                <li class="flex items-center gap-3 bg-white/10 rounded-xl px-4 py-3 text-white font-medium hover:bg-white/20 transition">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
                    Crypto
                </li>
                <li class="flex items-center gap-3 bg-white/10 rounded-xl px-4 py-3 text-white font-medium hover:bg-white/20 transition">
                    <span class="w-2.5 h-2.5 rounded-full bg-teal-400 shrink-0"></span>
                    Developer
                </li>
            </ul>
        </div>

        <!-- Ordered List Card -->
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-8 shadow-2xl">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-2">
                <span class="w-8 h-8 bg-cyan-500 rounded-full flex items-center justify-center text-sm">✦</span>
                Minat Jurusan
            </h2>
            <ol class="space-y-3">
                <li class="flex items-center gap-4 bg-white/10 rounded-xl px-4 py-3 text-white font-medium hover:bg-white/20 transition">
                    <span class="w-7 h-7 rounded-full bg-gradient-to-br from-cyan-400 to-emerald-400 flex items-center justify-center text-xs font-bold shrink-0">i</span>
                    Sistem Informasi
                </li>
                <li class="flex items-center gap-4 bg-white/10 rounded-xl px-4 py-3 text-white font-medium hover:bg-white/20 transition">
                    <span class="w-7 h-7 rounded-full bg-gradient-to-br from-teal-400 to-cyan-400 flex items-center justify-center text-xs font-bold shrink-0">ii</span>
                    Finance
                </li>
                <li class="flex items-center gap-4 bg-white/10 rounded-xl px-4 py-3 text-white font-medium hover:bg-white/20 transition">
                    <span class="w-7 h-7 rounded-full bg-gradient-to-br from-emerald-400 to-teal-400 flex items-center justify-center text-xs font-bold shrink-0">iii</span>
                    Ekonomi
                </li>
            </ol>
        </div>

        <!-- Back nav -->
        <div class="text-center">
            <a href="index.html" class="inline-block px-6 py-2 bg-white/20 hover:bg-white/30 transition rounded-full text-white text-sm font-semibold backdrop-blur-sm">
                ← Kembali ke Home
            </a>
        </div>

    </div>

</body>
</html>
